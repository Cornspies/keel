{% extends "base.html" %}
{% block content %}
{% include "repo/header.html" %}
<div class="narrow-left">
  <h2>New issue</h2>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/{{ repo.owner }}/{{ repo.name }}/issues" class="form">
    <label>Title <input name="title" value="{{ title }}" maxlength="256" required autofocus></label>
    <label>Description <textarea name="body" rows="12" placeholder="Markdown is supported. Reference issues with #123 and people with @name.">{{ body }}</textarea></label>
    <button class="btn btn-primary">Open issue</button>
  </form>
</div>
{% endblock %}
