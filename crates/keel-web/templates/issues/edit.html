{% extends "base.html" %}
{% block content %}
{% include "repo/header.html" %}
<div class="narrow-left">
  <h2>{{ heading }}</h2>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="{{ action }}" class="form">
    {% if with_title %}<label>Title <input name="title" value="{{ title }}" maxlength="256" required></label>{% endif %}
    <label>{% if with_title %}Description{% else %}Comment{% endif %} <textarea name="body" rows="14">{{ body }}</textarea></label>
    <div class="row-actions"><button class="btn btn-primary">Save</button> <a class="btn" href="{{ cancel_url }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
