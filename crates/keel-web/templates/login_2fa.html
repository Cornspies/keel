{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>Two-factor authentication</h1>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/login/2fa" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Code from your authenticator app <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9A-Za-z -]{6,12}" required autofocus class="code-input"></label>
    <button class="btn btn-primary">Verify</button>
  </form>
  <p class="muted">Lost your phone? Enter one of your recovery codes instead.</p>
</div>
{% endblock %}
