{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>Sign in</h1>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username or email <input name="login" value="{{ login }}" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary">Sign in</button>
  </form>
  {% if page.mail_enabled %}<p class="muted"><a href="/password/forgot">Forgot your password?</a></p>{% endif %}
  {% if page.registration_open %}<p class="muted">New here? <a href="/register">Create an account</a>.</p>{% endif %}
</div>
{% endblock %}
