<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}{% if page.title != page.site_name %} · {{ page.site_name }}{% endif %}</title>
<link rel="stylesheet" href="{{ page.css_url }}">
<script src="{{ page.js_url }}" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">{{ page.site_name }}</a>
    <form class="top-search" method="get" action="/search" role="search">
      <input name="q" placeholder="Search code" aria-label="Search code">
    </form>
    <nav class="topnav">
      {% if let Some(user) = page.viewer %}
        <details class="dropdown dropdown-right">
          <summary class="btn btn-small">New</summary>
          <div class="dropdown-menu">
            <a href="/new">New repository</a>
            <a href="/org/new">New organization</a>
          </div>
        </details>
        <a href="/{{ user.username }}">{{ user.username }}</a>
        <a href="/settings">Settings</a>
        <form method="post" action="/logout" class="inline"><button class="linkish">Sign out</button></form>
      {% else %}
        <a href="/login">Sign in</a>
        {% if page.registration_open %}<a class="btn btn-small" href="/register">Sign up</a>{% endif %}
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
