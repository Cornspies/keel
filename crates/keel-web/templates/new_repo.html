{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>New repository</h1>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/new" class="form">
    <label>Name
      <span class="prefixed">
        {% if owners.len() > 1 %}
        <select name="owner" aria-label="Owner" class="owner-select">
          {% for o in owners %}<option value="{{ o }}"{% if *o == owner %} selected{% endif %}>{{ o }}</option>{% endfor %}
        </select>
        {% else %}
        <span class="prefix">{{ owner }}</span><input type="hidden" name="owner" value="{{ owner }}">
        {% endif %}
        <span class="prefix">/</span>
        <input name="name" value="{{ name }}" maxlength="100" pattern="[A-Za-z0-9._\-]+" required autofocus>
      </span>
    </label>
    <label>Description <span class="hint">(optional)</span> <input name="description" value="{{ description }}"></label>
    <label class="check"><input type="checkbox" name="private" {% if is_private %}checked{% endif %}> Private <span class="hint">Only you can see and clone it.</span></label>
    <details class="mirror-options"{% if !mirror_url.is_empty() %} open{% endif %}>
      <summary>Mirror a repository hosted elsewhere</summary>
      <p class="hint">keel copies its branches and tags and keeps them in sync. Nobody can push to a mirror.</p>
      <label>Clone URL <input name="mirror_url" value="{{ mirror_url }}" placeholder="https://github.com/team/project.git"></label>
      <div class="form-row">
        <label>Username <span class="hint">(if needed)</span> <input name="mirror_username" autocomplete="off"></label>
        <label>Password or token <input name="mirror_password" type="password" autocomplete="new-password"></label>
      </div>
      <label>Sync <select name="mirror_interval">{% for (secs, label) in intervals %}<option value="{{ secs }}"{% if *secs == 28800 %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    </details>
    <button class="btn btn-primary">Create repository</button>
  </form>
</div>
{% endblock %}
