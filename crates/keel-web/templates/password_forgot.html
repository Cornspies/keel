{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>Reset your password</h1>
  <p class="muted">Enter the email address of your account and we'll send you a link to choose a new password.</p>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/password/forgot" class="form">
    <label>Email address <input name="email" type="email" value="{{ email }}" autocomplete="email" required autofocus></label>
    <button class="btn btn-primary">Send reset link</button>
  </form>
  <p class="muted"><a href="/login">Back to sign in</a></p>
</div>
{% endblock %}
