{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>New organization</h1>
  <p class="muted">Organizations own repositories together. Owners manage members and settings; members can create repositories and push to all of them.</p>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/org/new" class="form">
    <label>Name <input name="name" value="{{ name }}" pattern="[A-Za-z0-9\-]+" maxlength="39" required autofocus>
      <span class="hint">Letters, digits and hyphens. Becomes part of URLs, like a username.</span></label>
    <button class="btn btn-primary">Create organization</button>
  </form>
</div>
{% endblock %}
