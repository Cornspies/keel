{% extends "base.html" %}
{% block content %}
{% include "repo/header.html" %}
<div class="narrow-left">
  <p class="muted small"><a href="/{{ repo.owner }}/{{ repo.name }}/milestones">Milestones</a> / {{ heading }}</p>
  <h2>{{ heading }}</h2>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="{{ action }}" class="form">
    <label>Title <input name="title" value="{{ title }}" maxlength="100" required autofocus></label>
    <label>Due date <span class="hint">(optional)</span> <input type="date" name="due_on" value="{{ due_on }}" placeholder="YYYY-MM-DD"></label>
    <label>Description <span class="hint">(optional) Markdown is supported.</span> <textarea name="description" rows="6">{{ description }}</textarea></label>
    <div class="row-actions"><a class="btn" href="/{{ repo.owner }}/{{ repo.name }}/milestones">Cancel</a> <button class="btn btn-primary">{% if heading == "New milestone" %}Create milestone{% else %}Save{% endif %}</button></div>
  </form>
</div>
{% endblock %}
