<!doctype html>
<html lang="en"{% if theme != "auto" %} data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ css_url }}">
</head>
<body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="/">Home</a></div></header>
<main class="wrap narrow error-page">
  <p class="error-code">{{ status }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="btn" href="/">Go home</a></p>
</main>
</body>
</html>
