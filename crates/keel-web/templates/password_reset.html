{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>Choose a new password</h1>
  {% if let Some(e) = error %}<p class="flash flash-error">{{ e }}</p>{% endif %}
  <form method="post" action="/password/reset" class="form">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password <input name="new" type="password" minlength="8" autocomplete="new-password" required autofocus>
      <span class="hint">At least 8 characters. This signs you out everywhere else.</span></label>
    <label>Confirm new password <input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn btn-primary">Set password and sign in</button>
  </form>
</div>
{% endblock %}
