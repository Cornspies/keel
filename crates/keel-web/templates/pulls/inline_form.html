<form method="post" action="{{ ic.post_url }}" class="form inline-form">
  <input type="hidden" name="path" value="{{ f.path }}">
  <input type="hidden" name="side" value="{{ l.side }}">
  <input type="hidden" name="line" value="{{ l.line }}">
  <input type="hidden" name="head" value="{{ ic.head }}">
  <textarea name="body" rows="4" placeholder="Comment on this line. Markdown is supported." required autofocus></textarea>
  <div class="row-actions"><a class="btn btn-small" href="?#{{ l.anchor }}">Cancel</a> <button class="btn btn-primary btn-small">Add comment</button></div>
</form>
