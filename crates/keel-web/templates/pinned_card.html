<a class="repo-link" href="/{{ r.owner }}/{{ r.name }}">{{ r.name }}</a>{% if r.is_private %} <span class="badge">Private</span>{% endif %}
<p class="muted small">{{ r.description }}</p>
<p class="muted small pinned-meta">{% if r.stars > 0 %}<span title="Stars">★ {{ r.stars }}</span> · {% endif %}Updated {{ r.updated }}</p>
