# Pushing a tag like v0.23.0 (or v0.23) for the version in Cargo.toml tests
# keel, builds it for x86_64 and aarch64 Linux and publishes a GitHub release
# with the tagged commit's message as its notes.
#
# Releases are built with the dependencies in the tagged commit's
# Cargo.lock (`--locked`): the versions that were developed and tested
# with. They're checked against the RustSec advisory database first: a
# release with a known vulnerability stops there, until Cargo.lock is
# updated (or, for one that doesn't reach keel and can't be upgraded yet,
# until it's listed in .cargo/audit.toml with the reason).
#
# The actions are pinned to commits (the tag is in the comment), so a tag
# that's moved later can't change what builds a release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "keel") | .version')
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ] && [ "$tag.0" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check the dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --locked
          cargo audit

  test:
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install smoke test tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 git-lfs gnupg
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Smoke test
        run: |
          cargo build --locked
          scripts/smoke-test.sh target/debug/keel

  build:
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name=keel-${GITHUB_REF_NAME#v}-${{ matrix.arch }}-linux
          mkdir "$name"
          cp target/release/keel README.md "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keel-${{ matrix.arch }}
          path: keel-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The binaries.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
          git log -1 --format=%b "$GITHUB_REF_NAME^{commit}" > notes.md
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag $prerelease
