[workspace]
members = ["crates/*"]
default-members = ["crates/keel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
regex = "1.11"
regex-syntax = "0.8"
keel-core = { path = "crates/keel-core" }
keel-git = { path = "crates/keel-git" }
keel-web = { path = "crates/keel-web" }
keel-ssh = { path = "crates/keel-ssh" }
keel-search = { path = "crates/keel-search" }
keel-hooks = { path = "crates/keel-hooks" }
keel-mail = { path = "crates/keel-mail" }
keel-mirror = { path = "crates/keel-mirror" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace"] }
askama = "0.16"
syntect = { version = "5.3", default-features = false, features = ["parsing", "html", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
moka = { version = "0.12", features = ["sync"] }
argon2 = "0.6"
getrandom = "0.4"
libc = "0.2"
sha2 = "0.11"
sha1 = "0.11"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23"
hex = "0.4"
form_urlencoded = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
flate2 = "1"
brotli = "9"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
russh = "0.65"
# The version russh uses; for verifying SSH commit signatures.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "p384", "p521", "rsa"] }
pgp = { version = "0.21", default-features = false }
tempfile = "3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }

# Debug builds of keel run with optimized dependencies (SQLite, libgit2,
# syntax highlighting, compression): much faster pages while developing,
# for a slower first build only.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
